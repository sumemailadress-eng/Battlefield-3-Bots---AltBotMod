# AltBotMod V14 - Steady settings. Edit, then restart the server - or use Server Control's "Bot settings".
# In-game admins can use !botconfig reload. Optional enhanced_<port>.ini
# overrides just its listed keys for one server instance.
[VehicleAI]
Driving=1
LightVehicles=1
Boats=1
# Armor movement and native weapon control enabled; live server testing required.
ArmoredVehicles=1
DriverWeapons=1
# Optional filtered PD steering, inspired by FunBots' separate driving control.
SmoothSteering=0
BallisticAim=1
MinimumTripMeters=250
FindVehicleMeters=80
SquadVehicleMeters=90
DismountMeters=55
ReserveHumanMeters=5
# Speed caps in METRES PER SECOND; turns and visible obstacles reduce speed.
LightSpeedMps=34
BoatSpeedMps=22
TankSpeedMps=16
IfvSpeedMps=20
StuckSeconds=3
BailHealthFraction=0.10
SteerKp=1.5
SteerKd=0.08

[AircraftAI]
# Native translations of FunBots flight controllers, enabled for this test build.
Jets=1
Helicopters=1
AircraftWeapons=1
# Damage-triggered input only: native missile-lock events are not bound.
AircraftCountermeasures=1
# Dry, flat and clear pads allow landing/unload/takeoff; hover/drop remains fallback.
TransportDrops=1
AirPilotsPerTeam=6
AircraftFindMeters=200
JetCruiseMps=86.9444
JetHeightMeters=350
ChopperHeightMeters=110
JetOrbitMeters=300
ChopperOrbitMeters=70
AircraftWaitSeconds=8
AircraftAttackSeconds=8
# Short diagnostic capture: enable, reload, reproduce, then disable/reload.
AircraftDebug=0
# Only +1 and -1 are accepted; native axis directions need in-game checking.
AirYawSign=1
AirPitchSign=1
AirRollSign=1

# Missing options added by the installer; existing values above are preserved.
ReturnToBase=1
VehicleReturnMeters=3000
GroundDriversPerTeam=16
PassengerTakeover=1
JetCeilingMeters=600

[CombatAI]
# Detection and firing still require line of sight. Ranges are metres.
InfantryEngageMeters=260
ReconEngageMeters=450
InfantryReactionSeconds=0.20
InfantryAimMarginMeters=0.20
ArmorEngageMeters=800
ArmorInfantryMeters=400
# Optional primaries/attachment sets use exact paths from supplied FunBots.
# Missing assets retain captured kits; class gadgets and appearance are preserved.
WeaponVariety=1
WeaponAttachments=1
# AltBotMod V10: bolt-action sniper rifles spot and fight soldiers this far out, metres (150-900; V9 about 370).
SniperEngageMeters=550
# AltBotMod V14: side steps in a gunfight. 1 = a short step now and then, only under fire or with the enemy close;
# 2 = constant left-right (V9-V13, looked like strutting); 0 = none.
SideSteps=1
# AltBotMod V10: 1 = most sniper lives climb to high ground that overlooks the objective and snipe from there;
# 0 = snipers run to the flags like everyone else.
SniperOverwatch=1
# AltBotMod V11: 1 = two snipers may share a perch as a pair (a few metres apart); 0 = one per perch.
SniperPairs=1
# AltBotMod V11: 1 = medics and support drop medkits / ammo boxes unasked for themselves and teammates within 10 m.
ClassSupport=1
# AltBotMod V11: how far (metres, 20-250) a medic / support comes when a bot calls for a medkit or ammo (a player's call: 3x).
SupplyMeters=60
# AltBotMod V21: 1 = bots learn on every map: where they get stuck and whether they got through (with a jump), where
# drivers stall, where aircraft were lost low, helicopter landing spots, where soldiers die. Kept in BotMod_learned next
# to the server (one file per map and mode) - a new AltBotMod version keeps it. Server Control's Learning page shows it
# and deletes entries. 0 = nothing is read or written.
Learning=1
# AltBotMod V21: 1 = learn from human players too - the routes you walk, drive and sail become routes for the bots (from
# the next map load), and where you land a helicopter becomes a landing spot for transports. 0 = only the bots' own.
LearnFromPlayers=1
# AltBotMod V13: 1 = the live map - the server writes where everyone is and where each bot is heading, who killed whom
# and where bots get stuck to BotMod\LiveMap, for the Live map page in Server Control; 0 = off. It can be switched per
# server on that page (LiveMap in enhanced_<port>.ini), and it takes effect at once.
LiveMap=1
# AltBotMod V13: how often the live picture is written (seconds, 0.5-10).
LiveMapSeconds=1
# AltBotMod V13: how often each soldier's position is added to the traffic heatmap (seconds, 1-60).
LiveMapTrailSeconds=5
# AltBotMod V13: history file size (MB, 5-1000) before it rolls over to events_<port>.old.txt (one old file is kept).
LiveMapKeepMB=64

[Tactics]
# Short checked road legs help drivers leave deployment on large mountain maps.
DriveInStages=1
# Menu-only aircraft are learned from a successful human pilot spawn this round.
LearnAircraftDeployment=1
TransportLandings=1
WeaponHandling=1
ArmorTactics=1
ArmorInfantrySupport=1
ArmorRepairHealthFraction=0.35
ArmorTacticMeters=70
TrafficManagement=1
ConvoySpacingMeters=14
VehicleDiagnostics=1

[AltBotMod]
# Combat: 0 = Test15 behaviour, 1 = aggressive, 2 = brutal (longer bursts, shorter pauses, faster
# reactions, wider vision, longer engage range, fewer idle flag guards).
Aggression=2
# Follow Fun-Bots' recorded routes (BotMod_traces folder next to the server exe). 0 = navigation grid only.
FunBotsRoutes=1
# AltBotMod V34: near flags, M-COMs and bases walk Fun-Bots' objective mesh (BotMod_traces\navzones). 0 = routes and grid only.
FunBotsMesh=1
# AltBotMod V15: what the routes record besides the paths - boarding spots (the recorded way into a vehicle), exit points
# (passengers / everyone get out on the way to a flag), waits (a bot holds a few seconds) and crouch sections. 0 = paths only.
RouteActions=1
# AltBotMod V15: a recon with a radio beacon sets one at a recorded beacon spot near its objective (half of its lives). 0 = off.
ReconBeacons=1
# Damage multiplier for bullets fired BY bots (0.25 - 4). Takes effect once the log shows
# "damage: ... confirmed"; until then bots do normal damage.
BotDamage=1.5
# AltBotMod V9: bot gunfight level - off (V8 combat), easy, normal, hard, veteran, elite. The profiles come from
# the BotMod public preview build (reaction, bursts, fire window, ranges, side steps, hops, far crouch, grenades).
# Overrides Aggression for infantry combat. Server Control can set it per server (BotMod\enhanced_<port>.ini).
Difficulty=elite
# 1 = each bot plays one level either side of Difficulty (a mixed squad).
RandomDifficulty=0
# AltBotMod V16: each life an engineer carries a SMAW / RPG-7, a Javelin or (maps with aircraft) a Stinger / Igla; support a
# claymore or C4; recon T-UGS or a SOFLAM. 0 = the gadgets of BotMod_loadouts.txt only.
GadgetVariety=1
# AltBotMod V16: a soldier with C4 runs up to a slow enemy vehicle, plants two charges, backs off and sets them off.
C4Attacks=1
# AltBotMod V16: Javelin at ground vehicles, Stinger / Igla at aircraft - down the sight, a 2.2 s lock, fire.
LockOnLaunchers=1
# AltBotMod V16: tickets a bot respawn costs its team (0 - 2). 0.5: bots die more often than people.
BotTicketCost=0.5
# AltBotMod V16: bot tank / IFV drivers pop smoke when a hit lands (once per 25 s).
VehicleCountermeasures=1
# AltBotMod V16.2: damage multipliers for vehicles (0.25-4, 1 = the game's damage).
# VehicleDamageTaken: all damage a vehicle takes. VehicleDamageDealt: damage done by anyone in a vehicle (to soldiers and vehicles).
VehicleDamageTaken=1
VehicleDamageDealt=1

# AltBotMod V28: gamertags for bots (BotMod_names.txt) - 0 = the [BOT] Support RU names
BotNames=1

# AltBotMod V29: lock-on assist - a bot's lock-on weapon (Stinger, Igla, Javelin, heat seekers, AA missiles) locks after the
# weapon's own lock time on target (the game's own lock never locks for a bot). 0 = off.
LockOnAssist=1
# AltBotMod V29/V34: jets stay in the box round the flags, both bases and the airfields, plus this many metres (0 = no box).
JetAreaMarginMeters=900

# AltBotMod V31: seconds a bot holds a lock-on weapon on its target before the lock is in place (the weapon's own lock
# time if that is shorter; 0 = at once).
LockOnSeconds=0.5
# AltBotMod V31: how far helicopter door gunners and Little Bird bench passengers shoot (m).
DoorGunMeters=600
# AltBotMod V34: after the round's opening a bot on foot walks at most this far to a free vehicle (one with its objective
# close by: 40 m). The first minutes, and bots choosing where to spawn, are not limited.
VehicleWalkMeters=250
